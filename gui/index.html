<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="AvNavUpdate">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="lib/codeflask.css">
    <script type="text/javascript" src="index.js"></script>
    <script type="text/javascript" src="lib/codeflask.min.js"></script>

    <title>AvNavUpdate</title>
  </head>
  <body>
    <noscript>
      Diese Seite funktioniert nur mit java script.
    </noscript>
    <div class="title" id="title">AvNav Updater</div>
    <div id="root">
      <main class="packagePanel">
        <h1>Packages <span id="packageCount" class="packageCount"></span></h1>
        <div class="listTools">
          <input type="search" id="packageSearch" class="packageSearch" placeholder="Search packages" aria-label="Search packages" autocomplete="off"/>
          <div class="chips" role="group" aria-label="Package filter">
            <button type="button" class="chip" data-filter="updates" aria-pressed="true">Updates</button>
            <button type="button" class="chip" data-filter="all" aria-pressed="false">All</button>
            <button type="button" class="chip" data-filter="disabled" aria-pressed="false">Disabled</button>
          </div>
        </div>
        <ul class="infoFrame packageList" id="infoFrame" aria-live="polite"></ul>
      </main>
      <aside class="sidebarFrame">
        <section class="controlGroup statusPanel" aria-labelledby="statusHeading">
          <h2 id="statusHeading">Status</h2>
          <div class="row statusPair">
            <span class="pairItem">
              <span class="label">Internet</span>
              <span id="networkStatus" class="statusText unknown" role="status" aria-label="Internet status"></span>
            </span>
            <label class="pairItem" for="networkUpdate">
              <span class="label">Auto Update</span>
              <input type="checkbox" id="networkUpdate"/>
            </label>
          </div>
          <div class="row">
            <span class="label">AvNav</span>
            <span class="statusText" id="avnavStatusText"></span>
          </div>
          <div class="row currentAction">
            <span class="label">Activity</span>
            <div id="runningAction" class="stopped">
              <span id="listState" class="listState" role="status"></span>
              <span class="actionName blink"></span>
              <button id="showConsole">Console</button>
            </div>
          </div>
        </section>
        <div class="rightFrame">
        <section class="controlGroup" aria-labelledby="optionsHeading">
          <h2 id="optionsHeading">Options</h2>
          <label class="row" for="allowDowngrade">
            <span class="label">Allow downgrade</span>
            <input type="checkbox" id="allowDowngrade"/>
          </label>
          <p class="hint">Also offer older versions of packages. Use with care.</p>
          <div class="row">
            <span class="label">Beta</span>
            <span class="statusText unknown" id="betaStatus" role="status" aria-label="Beta status"></span>
          </div>
          <p class="hint">Beta uses pre-release package sources.</p>
          <div class="buttonGroup">
            <button id="enableBeta" class="action">Enable Beta</button>
            <button id="disableBeta" class="action">Disable Beta</button>
          </div>
        </section>
        <section class="controlGroup" aria-labelledby="refreshHeading">
          <h2 id="refreshHeading">Refresh</h2>
          <div class="buttonGroup">
            <button id="reload">Reload</button>
            <button id="updateList" class="action">Refresh Package Info</button>
          </div>
        </section>
        <section class="controlGroup actionGroup" aria-labelledby="actionHeading">
          <h2 id="actionHeading">Action</h2>
          <button id="updatePackages" class="action primaryAction">Update Packages</button>
          <div class="selectLinks">
            <button type="button" id="selectAll" class="linkButton">Select all</button>
            <button type="button" id="selectNone" class="linkButton">Select none</button>
          </div>
        </section>
        <section class="controlGroup" aria-labelledby="toolsHeading">
          <h2 id="toolsHeading">Tools</h2>
          <div class="buttonGroup">
            <button id="restart" class="action">Restart AvNav</button>
            <button id="showLog" class="action">AvNav Log</button>
            <button id="showEdit" class="action">AvNav Config</button>
          </div>
        </section>
        </div>
      </aside>
    </div>  
  <div class="overlayFrame" id="responseOverlay">
    <div class="overlay">
      <div class="overlayContent">

      </div>
      <div class="overlayButtons">
        <button id="closeOverlay">Close</button>
      </div>
    </div>
  </div>
  <div class="overlayFrame" id="confirmOverlay">
    <div class="overlay">
      <div class="overlayContent"></div>
      <div class="overlayButtons">
        <button id="confirmCancel">Cancel</button>
        <button id="confirmOk" class="primaryAction">Update</button>
      </div>
    </div>
  </div>
  <div class="overlayFrame" id="logOverlay">
      <div class="overlay">
        <div class="overlayContent">
  
        </div>
        <div class="overlayButtons">
          <button id="downloadLogOverlay">Download</button>
          <button id="refreshLogOverlay">Refresh</button>
          <button id="closeLogOverlay">Close</button>
        </div>
      </div>
    </div>
    <div class="overlayFrame" id="editOverlay">
        <div class="overlay">
          <div class="overlayContent">
    
          </div>
          <div class="overlayButtons">
            <button id="downloadEditOverlay">Download</button>
            <button id="closeEditOverlay">Cancel</button>
            <button id="saveEditOverlay">Save</button>
          </div>
        </div>
      </div>
  </body>
</html>
